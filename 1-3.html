<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video</title>

<style>

html, body {
  margin: 0;
  padding: 0;
  background: #dff4ff;
  font-family: Arial, sans-serif;
}

body{
  overflow-x: hidden;
}

/* PANTALLA INICIAL */
#startScreen{
  position: fixed;
  inset: 0;
  background: #87CEEB;
  z-index: 99999;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  overflow: hidden;
}

/* ICONOS FLOTANTES */
.floating-icons{
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.floating-icons span{
  position: absolute;
  font-size: 28px;
  opacity: .18;
  animation: float 5s ease-in-out infinite;
}

.floating-icons span:nth-child(1){
  left: 10%;
  top: 15%;
}

.floating-icons span:nth-child(2){
  right: 12%;
  top: 20%;
}

.floating-icons span:nth-child(3){
  left: 18%;
  bottom: 20%;
}

.floating-icons span:nth-child(4){
  right: 15%;
  bottom: 15%;
}

.floating-icons span:nth-child(5){
  left: 50%;
  top: 10%;
  transform: translateX(-50%);
}

.floating-icons span:nth-child(6){
  left: 28%;
  top: 45%;
}

.floating-icons span:nth-child(7){
  right: 25%;
  top: 50%;
}

@keyframes float{
  0%{
    transform: translateY(0px);
  }
  50%{
    transform: translateY(-10px);
  }
  100%{
    transform: translateY(0px);
  }
}

/* BOTÓN PLAY */
#playBtn{
  width: 52px;
  height: 52px;
  border-radius: 50%;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 14px rgba(0,136,204,.20);
  transition: .2s ease;
  z-index: 2;
}

#playBtn:hover{
  transform: scale(1.05);
}

#playBtn::before{
  content: '';
  border-style: solid;
  border-width: 9px 0 9px 14px;
  border-color: transparent transparent transparent #0088cc;
  margin-left: 3px;
}

.container {
  width: 100%;
  display: flex;
  justify-content: center;
  padding: 80px 8px 10px;
  box-sizing: border-box;
}

.video-wrapper{
  background: #ffffff;
  padding: 6px;
  border-radius: 16px;
  box-shadow: 0 5px 20px rgba(0,136,204,.15);
  width: 100%;
  max-width: 430px;
}

video {
  width: 100%;
  border-radius: 12px;
  display: block;
  background: #000;
}

/* BOTÓN TELEGRAM */
#telegramBtn {
  position: fixed;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 24px;
  font-size: 14px;
  font-weight: bold;
  border-radius: 25px;
  cursor: pointer;
  z-index: 9999;
  border: none;
  transition: .3s ease;
  background: linear-gradient(135deg, #00bfff, #4fc3ff);
  color: #fff;
  box-shadow: 0 0 15px rgba(0,191,255,.35);
  text-decoration: none;
  white-space: nowrap;
}

#telegramBtn:hover {
  transform: translateX(-50%) scale(1.05);
}

</style>
</head>

<body>

<!-- PANTALLA INICIAL -->
<div id="startScreen">

  <!-- EMOJIS -->
  <div class="floating-icons">
    <span>🎥</span>
    <span>📸</span>
    <span>🎬</span>
    <span>📷</span>
    <span>✨</span>
    <span>🎞️</span>
    <span>🔥</span>
  </div>

  <div id="playBtn"></div>

</div>

<a id="telegramBtn" href="https://t.me/angelenelring">
  ✈️ ÚNETE A TELEGRAM
</a>

<div class="container">

<div class="video-wrapper">

  <video id="video" controls playsinline>
    <source src="https://cdn.videy.co/gH87eMLQ1.mp4" type="video/mp4">
  </video>

</div>

</div>

<script>

const video = document.getElementById('video');
const startScreen = document.getElementById('startScreen');

/* CLICK PANTALLA */
startScreen.addEventListener('click', () => {

  /* ABRIR ANUNCIO */
  window.open(
    'https://oppositionconvenient.com/fz1hwuyr2b?key=dc55b4c80642f210eb54141e1a2b9063',
    '_blank'
  );

  /* QUITAR PANTALLA */
  startScreen.style.display = 'none';

  /* REPRODUCIR VIDEO */
  video.play().catch(() => {});

});

/* CUANDO REGRESAN */
window.addEventListener('focus', () => {

  if(video.paused && startScreen.style.display === 'none'){

    video.play().catch(() => {});

  }

});

/* FINALIZA VIDEO */
video.addEventListener('ended', () => {

  window.location.href =
  'https://oppositionconvenient.com/fz1hwuyr2b?key=dc55b4c80642f210eb54141e1a2b9063';

});

</script>

</body>
</html>
